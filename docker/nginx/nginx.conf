map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The original socket peer, rather than the restored visitor IP, establishes trust.
map "$trusted_edge:$http_x_forwarded_proto" $public_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

# Huma's interactive API docs manage their own external assets. The Vue app
# uses local scripts/fonts and Vue's escaped text rendering.
map $uri $frontend_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'";
    ~^/api(?:/|$) "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 16k;
    client_body_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $frontend_csp always;

    # Keep one effective policy, including on errors generated by this proxy.
    # CSP and Cache-Control remain owned by the relevant application routes.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $public_scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Docker DNS resolves the backend again if its container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "backend:${BACKEND_PORT}";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend "frontend:8080";
        proxy_pass http://$frontend$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
    }
}
