version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - cyclop
    - dupl
  settings:
    cyclop:
      max-complexity: 15
    dupl:
      threshold: 100
  exclusions:
    generated: strict
    paths:
      - ^ent/
    # Existing debt only; see ../VALIDATION.md. Exact complexity values ensure
    # increases still fail. Remove each exception when its debt is addressed.
    rules:
      - path: ^internal/user/delivery/http/user_test\.go$
        linters: [cyclop]
        text: '^calculated cyclomatic complexity for function TestUserAndAuthAPI_Integration is 69, max is 15$'
      - path: ^(cmd/api/main|internal/user/delivery/http/user_test)\.go$
        linters: [errcheck]
        text: '^Error return value of `client.Close` is not checked$'
        source: '^\s*defer client\.Close\(\)$'
      - path: ^internal/user/delivery/http/user_test\.go$
        linters: [errcheck]
        text: '^Error return value of `db.Close` is not checked$'
        source: '^\s*defer db\.Close\(\)$'
      - path: ^internal/user/delivery/http/user_test\.go$
        linters: [errcheck]
        text: '^Error return value of `resp.Body.Close` is not checked$'
        source: '^\s*(defer )?resp\.Body\.Close\(\)$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
